<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Story Outline Tool</title>
  <meta name="description" content="A local, browser-only tool for outlining a story's chapters and subplots.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='4' width='11' height='24' rx='2' fill='%233b5bdb'/%3E%3Crect x='17' y='4' width='12' height='7' rx='2' fill='%23e4572e'/%3E%3Crect x='17' y='13' width='12' height='7' rx='2' fill='%232f9e44'/%3E%3Crect x='17' y='22' width='12' height='6' rx='2' fill='%23f08c00'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <rect x="3" y="4" width="11" height="24" rx="2" fill="#3b5bdb"/>
        <rect x="17" y="4" width="12" height="7" rx="2" fill="#e4572e"/>
        <rect x="17" y="13" width="12" height="7" rx="2" fill="#2f9e44"/>
        <rect x="17" y="22" width="12" height="6" rx="2" fill="#f08c00"/>
      </svg>
      <h1>Story Outline Tool</h1>
    </div>

    <nav class="tabs" aria-label="Stories">
      <div class="tab-list" id="tab-list" role="tablist"></div>
      <button type="button" class="icon-btn tab-add" id="tab-add" title="New story tab" aria-label="New story tab">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 4v12M4 10h12"/></svg>
      </button>
    </nav>

    <div class="header-actions">
      <span class="save-status" id="save-status" title="Your outlines are saved in this browser's local storage">Saved in this browser</span>
      <button type="button" class="icon-btn" id="undo-btn" title="Undo (Ctrl+Z)" aria-label="Undo">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7 5 3 9l4 4"/><path d="M3 9h9a5 5 0 0 1 0 10h-2"/></svg>
      </button>
      <button type="button" class="icon-btn" id="redo-btn" title="Redo (Ctrl+Shift+Z)" aria-label="Redo">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m13 5 4 4-4 4"/><path d="M17 9H8a5 5 0 0 0 0 10h2"/></svg>
      </button>
      <button type="button" class="btn" id="data-btn" aria-haspopup="menu">
        Data
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m6 8 4 4 4-4"/></svg>
      </button>
    </div>
  </header>

  <main class="board" id="board" aria-label="Story outline"></main>

  <dialog class="dialog" id="chapter-dialog" aria-labelledby="chapter-dialog-title">
    <form method="dialog" id="chapter-form">
      <header class="dialog-header">
        <h2 id="chapter-dialog-title">Edit chapter</h2>
        <span class="dialog-sub" id="chapter-dialog-number"></span>
      </header>
      <label class="field">
        <span class="field-label">Name</span>
        <input type="text" name="name" id="chapter-name" autocomplete="off" required maxlength="200">
      </label>
      <label class="field">
        <span class="field-label">State</span>
        <select name="state" id="chapter-state"></select>
      </label>
      <label class="field">
        <span class="field-label">Summary <span class="field-hint">optional</span></span>
        <textarea name="summary" id="chapter-summary" rows="4" maxlength="5000"></textarea>
      </label>
      <fieldset class="field">
        <legend class="field-label">Subplots</legend>
        <div class="subplot-checks" id="chapter-subplots"></div>
      </fieldset>
      <footer class="dialog-footer">
        <button type="button" class="btn btn-danger-quiet" id="chapter-delete">Delete chapter</button>
        <span class="spacer"></span>
        <button type="button" class="btn" id="chapter-cancel">Cancel</button>
        <button type="submit" class="btn btn-primary" value="save">Save</button>
      </footer>
    </form>
  </dialog>

  <dialog class="dialog dialog-small" id="confirm-dialog" aria-labelledby="confirm-title">
    <form method="dialog">
      <h2 id="confirm-title"></h2>
      <p id="confirm-message"></p>
      <footer class="dialog-footer">
        <span class="spacer"></span>
        <button type="submit" class="btn" value="cancel">Cancel</button>
        <button type="submit" class="btn btn-danger" value="confirm" id="confirm-ok">Delete</button>
      </footer>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" hidden>
    <span id="toast-text"></span>
    <button type="button" class="btn btn-small" id="toast-action" hidden></button>
  </div>
  <div class="sr-only" id="live" aria-live="polite"></div>

  <script src="js/store.js"></script>
  <script src="js/io.js"></script>
  <script src="js/drag.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
